name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [oldstable, stable]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
    - if: always()
      run: |
        uname -r
        go test -count=5 -v -run 'TestPipeMessenger$' . 2>&1 | grep -E '^(=== RUN|--- |ok|FAIL)' | sort | uniq -c
        go test -count=1 -v -run 'TestSetDefaultGoSocketOptions' . 2>&1 | tail -8
        go test -count=1 -v -race . 2>&1 | grep -E '^(--- FAIL|=== RUN)' | grep -B1 'FAIL' 
    - run: go test -race ./...
    - run: GOOS=windows go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v7
      with:
        go-version: stable
        cache: false
    - uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15
